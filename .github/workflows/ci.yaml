name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: pip install ruff aiohttp rich typer
      - run: ruff check .
      - run: ruff format --check .
      - uses: actions/checkout@v7
        with:
          repository: pschmitt/browser-daemon
          path: browser-daemon
      - run: |
          mkdir -p /tmp/dev && ln -s "$PWD/custom_components/hrworks/hrworks" /tmp/dev/hrworks
          echo "PYTHONPATH=$PWD:/tmp/dev:$PWD/browser-daemon/python" >> "$GITHUB_ENV"
      - run: python -m unittest discover -s tests -v

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
  homeassistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: pip install homeassistant==2026.10.4
      - uses: actions/checkout@v7
        with:
          repository: pschmitt/browser-daemon
          path: browser-daemon
      - run: |
          mkdir -p /tmp/dev && ln -s "$PWD/custom_components/hrworks/hrworks" /tmp/dev/hrworks
          echo "PYTHONPATH=$PWD:/tmp/dev:$PWD/browser-daemon/python" >> "$GITHUB_ENV"
      - run: python -m unittest discover -s tests/ha -v
